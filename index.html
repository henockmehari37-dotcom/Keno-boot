<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ras Bet - Fast Keno & Bingo Edition</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg-color: #0b151b;
      --card-bg: #12212b;
      --accent-purple: #8a2be2;
      --purple-gradient: linear-gradient(135deg, #a832e3, #6a11cb);
      --text-white: #ffffff;
      --text-gray: #9aa8b6;
      --nav-bg: #091a24;
      --border-color: #1e3342;
      --keno-green: #2ecc71;
      --bingo-gold: #ffb703;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: 80px;
      position: relative;
      min-height: 100vh;
    }

    /* Top Banner */
    .top-banner {
      background: linear-gradient(135deg, #4a00e0, #8e2de2);
      padding: 15px;
      border-radius: 12px;
      margin: 10px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
    }

    .banner-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .banner-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .banner-text h3 {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .btn-click-here {
      background-color: #ffffff;
      color: #6a11cb;
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      text-transform: uppercase;
    }

    /* Categories Horizontal Scroll */
    .categories-tabs {
      display: flex;
      gap: 10px;
      padding: 10px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .categories-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background-color: var(--card-bg);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text-gray);
      cursor: pointer;
      border: 1px solid var(--border-color);
    }

    .tab.active {
      background: var(--purple-gradient);
      color: var(--text-white);
      border: none;
      font-weight: 600;
    }

    /* Search Bar & Filter */
    .search-container {
      padding: 5px 10px;
    }

    .search-box, .filter-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-white);
      width: 100%;
      font-size: 14px;
    }

    .filter-box {
      color: var(--text-gray);
      font-size: 14px;
      cursor: pointer;
    }

    /* Section Header */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 10px 10px 10px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
    }

    .btn-collapse {
      background-color: #1a2b36;
      border: none;
      color: var(--text-gray);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    /* Game Grid */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 10px 20px 10px;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-white);
      cursor: pointer;
    }

    .game-thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background-color: #1a2b3c;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .game-title {
      font-size: 12px;
      margin-top: 6px;
      text-align: center;
      color: #c4d1db;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .bg-jetx {
      background: linear-gradient(180deg, #111 0%, #3a3000 100%);
      color: #ffe600;
      font-weight: bold;
      font-size: 20px;
      font-style: italic;
    }

    .bg-aviator {
      background: linear-gradient(180deg, #600 0%, #200 100%);
      color: #fff;
      font-weight: bold;
      font-size: 18px;
    }

    .bg-fastkeno {
      background: linear-gradient(135deg, #11998e, #38ef7d);
      color: #000;
      font-weight: 900;
      font-size: 18px;
      text-align: center;
      line-height: 1.1;
    }

    .bg-bingo {
      background: linear-gradient(135deg, #ff007f, #7928ca);
      color: #fff;
      font-weight: 900;
      font-size: 18px;
      text-align: center;
      line-height: 1.1;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    /* Floating Cashback */
    .floating-cashback {
      position: fixed;
      bottom: 75px;
      right: 15px;
      background: var(--purple-gradient);
      color: white;
      padding: 10px 18px;
      border-radius: 25px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(138, 43, 226, 0.5);
      cursor: pointer;
      z-index: 100;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background-color: var(--nav-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-gray);
      text-decoration: none;
      font-size: 11px;
    }

    .nav-item.active {
      color: var(--accent-purple);
    }

    .nav-item i {
      font-size: 18px;
    }

    /* --- COMMON MODAL OVERLAY STYLES --- */
    .game-modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 100%;
      background-color: #0c1821;
      z-index: 3000;
      flex-direction: column;
      overflow-y: auto;
    }

    .modal-top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background-color: #12212b;
    }

    .btn-back-link {
      background: #1d2f3d;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-deposit-purple {
      background: #8a2be2;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }

    .modal-sub-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background-color: #0d1922;
      font-size: 12px;
      color: var(--text-gray);
      border-bottom: 1px solid #1a2d3b;
    }

    /* --- FAST KENO STYLES --- */
    .keno-hero-banner {
      background: radial-gradient(circle at center, #1b3644 0%, #0c1821 100%);
      padding: 15px;
      position: relative;
      text-align: center;
    }

    .timer-display {
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .choose-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .circle-icon-badge {
      width: 45px;
      height: 45px;
      background: radial-gradient(circle, #2ecc71, #11998e);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.4);
    }

    .choose-text h2 {
      font-size: 20px;
      color: #ffffff;
      text-align: left;
    }

    .choose-text p {
      font-size: 14px;
      color: #2ecc71;
      text-align: left;
      font-weight: 600;
    }

    .drawing-animation-area {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 10px;
      background: radial-gradient(circle at center, #1b3644 0%, #0c1821 100%);
      min-height: 220px;
    }

    .main-ball {
      width: 70px;
      height: 70px;
      background: radial-gradient(circle at 30% 30%, #3a5c72, #0d1a24);
      border: 3px solid #2ecc71;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 0 15px rgba(46, 204, 113, 0.5);
      margin-bottom: 15px;
    }

    .drawn-balls-history {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .drawn-mini-ball {
      width: 32px;
      height: 32px;
      background: #1e3342;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
      border: 1px solid #2ecc71;
    }

    .keno-grid-80 {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
      padding: 10px;
      background-color: #0c1821;
    }

    .grid-num-btn {
      background-color: #172834;
      border: 1px solid #213747;
      color: #a2b7c7;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .grid-num-btn.selected {
      background-color: #2ecc71;
      color: #000;
      border-color: #fff;
      box-shadow: 0 0 6px #2ecc71;
    }

    .bet-control-bar {
      padding: 10px;
      background-color: #12212b;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bet-row {
      display: flex;
      gap: 6px;
    }

    .btn-minus-plus {
      background: #1e3342;
      border: 1px solid #294457;
      color: #fff;
      width: 45px;
      height: 40px;
      border-radius: 6px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .bet-val-box {
      flex: 1;
      background: #0d1922;
      border: 1px solid #213747;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      border-radius: 6px;
    }

    .btn-x2, .btn-max-bet {
      background: #1e3342;
      border: 1px solid #294457;
      color: #2ecc71;
      padding: 0 16px;
      height: 40px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-main-bet {
      background: linear-gradient(180deg, #2ecc71, #27ae60);
      color: #000;
      border: none;
      height: 46px;
      border-radius: 8px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .btn-main-bet:disabled {
      background: #213747;
      color: #5d7585;
      cursor: not-allowed;
    }

    .sub-nav {
      display: flex;
      justify-content: space-around;
      background: #0d1922;
      padding: 10px 0;
      border-top: 1px solid #1a2d3b;
      border-bottom: 1px solid #1a2d3b;
      font-size: 12px;
      font-weight: bold;
    }

    .sub-nav-item {
      color: var(--text-gray);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sub-nav-item.active {
      color: #2ecc71;
      border-bottom: 2px solid #2ecc71;
      padding-bottom: 3px;
    }

    .bets-history-list {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bet-ticket-card {
      background-color: #12212b;
      border: 1px solid #1e3342;
      border-radius: 8px;
      padding: 10px;
    }

    .ticket-title-bar {
      display: flex;
      justify-content: space-between;
      color: #2ecc71;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .ticket-selected-balls {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .mini-num-badge {
      background-color: #213747;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }

    .ticket-status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-gray);
      border-top: 1px dashed #1e3342;
      padding-top: 6px;
    }

    .status-waiting {
      color: #f1c40f;
      font-weight: bold;
    }

    /* --- BINGO GAME STYLES --- */
    .bingo-card-container {
      padding: 15px;
      background: radial-gradient(circle at center, #2b1055 0%, #0c1821 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .bingo-header-letters {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      width: 100%;
      max-width: 320px;
      gap: 6px;
      text-align: center;
    }

    .bingo-letter {
      font-size: 22px;
      font-weight: 900;
      color: var(--bingo-gold);
      text-shadow: 0 0 8px rgba(255, 183, 3, 0.6);
    }

    .bingo-grid-5x5 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 320px;
    }

    .bingo-cell {
      background-color: #1b2838;
      border: 2px solid #34495e;
      color: #fff;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .bingo-cell.free {
      background: var(--purple-gradient);
      color: #fff;
      font-size: 12px;
      font-weight: 900;
    }

    .bingo-cell.daubed {
      background: radial-gradient(circle, #ff007f, #b5179e);
      border-color: #ff9ebb;

      box-
