<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beteseb Plus - ኬኖ ጨዋታ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b1120;
            color: #ffffff;
            padding-bottom: 70px;
            display: flex;
            justify-content: center;
        }
        .main-container {
            width: 100%;
            max-width: 430px;
            background: #0f172a;
            min-height: 100vh;
            padding: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            position: relative;
        }
        .promo-banner {
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .promo-banner h3 {
            font-size: 14px;
            margin-bottom: 4px;
        }
        .promo-banner p {
            font-size: 11px;
            color: #e2e8f0;
        }
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 12px;
            padding-bottom: 5px;
        }
        .cat-btn {
            background: #1e293b;
            color: #94a3b8;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            cursor: pointer;
        }
        .cat-btn.active {
            background: #7c3aed;
            color: white;
        }
        .wallet-card {
            background: #1e293b;
            padding: 12px 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }
        .wallet-info span {
            color: #38bdf8;
            font-size: 16px;
            font-weight: bold;
        }
        .btn-deposit {
            background-color: #10b981;
            color: white;
            padding: 8px 16px;
            font-size: 13px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .section-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .timer-badge {
            background: #1e293b;
            color: #f59e0b;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            border: 1px solid #334155;
        }
        .keno-box {
            background: #1e293b;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }
        .keno-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            margin-bottom: 12px;
        }
        .ball {
            background: #0f172a;
            color: #cbd5e1;
            border-radius: 6px;
            padding: 6px 0;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            user-select: none;
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }
        .ball.selected {
            background: #f59e0b !important;
            color: #000 !important;
            border-color: #d97706;
        }
        .ball.drawn {
            background: #10b981 !important;
            color: #fff !important;
            transform: scale(1.1);
            box-shadow: 0 0 8px #10b981;
        }
        .bet-row {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-bottom: 10px;
        }
        .btn-ctrl {
            background: #0f172a;
            color: white;
            border: 1px solid #334155;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .bet-display {
            flex-grow: 1;
            text-align: center;
            font-weight: bold;
            color: #34d399;
            font-size: 15px;
            background: #0f172a;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
        .btn-bet {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-weight: bold;
            font-size: 16px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .status-banner {
            background: #0f172a;
            color: #f59e0b;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
            border: 1px solid #334155;
        }
        .sub-tabs {
            display: flex;
            background: #1e293b;
            padding: 5px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .sub-tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #94a3b8;
            padding: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
        }
        .sub-tab-btn.active {
            background: #0f172a;
            color: #38bdf8;
        }
        .log-box {
            background: #1e293b;
            padding: 10px;
            border-radius: 8px;
            max-height: 130px;
            overflow-y: auto;
            font-size: 12px;
            color: #cbd5e1;
            border: 1px solid #334155;
            margin-bottom: 15px;
        }
        .log-item {
            padding: 4px 0;
            border-bottom: 1px solid #2f3e53;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: #0b1120;
            border-top: 1px solid #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 50;
        }
        .nav-item {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            gap: 2px;
        }
        .nav-item.active {
            color: #a855f7;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            border: 1px solid #334155;
            text-align: center;
        }
        .modal input {
            width: 90%;
            padding: 12px;
            font-size: 16px;
            margin: 15px 0;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            text-align: center;
        }
        .btn-modal-ok {
            background-color: #0284c7;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
            font-weight: bold;
        }
        .close-btn {
            color: #aaa;
            float: right;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="promo-banner">
            <h3>Beteseb Plus Keno Bonus!</h3>
            <p>በቴሌብር ባላንስ በመሙላት እስከ 3X ያሸንፉ 🚀</p>
        </div>

        <!-- Categories Filter Bar -->
        <div class="categories">
            <button class="cat-btn" onclick="filterCategory(this, 'lobby')">🎮 Lobby</button>
            <button class="cat-btn active" onclick="filterCategory(this, 'keno')">⚡ Keno</button>
            <button class="cat-btn" onclick="filterCategory(this, 'slots')">🎰 Slots</button>
            <button class="cat-btn" onclick="filterCategory(this, 'crash')">🚀 Crash</button>
        </div>

        <div class="wallet-card">
            <div class="wallet-info">ባላንስ: <span id="userBalance">0</span> ETB</div>
            <button class="btn-deposit" onclick="openDepositModal()">Deposit</button>
        </div>

        <div id="kenoGameSection">
            <div class="section-title">
                <span id="drawTitle">DRAW #1024</span>
                <div class="timer-badge">⏱️ <span id="timer">00:45</span></div>
            </div>

            <div class="keno-box">
                <div class="keno-grid" id="kenoGrid"></div>
                
                <div class="bet-row">
                    <button class="btn-ctrl" onclick="changeBet(-5)">-</button>
                    <div class="bet-display"><span id="betVal">10</span> ETB</div>
                    <button class="btn-ctrl" onclick="changeBet(5)">+</button>
                    <button class="btn-ctrl" onclick="quickPick()">🎲 Quick</button>
                    <button class="btn-ctrl" onclick="clearSelection()">🗑️</button>
                </div>

                <button class="btn-bet" id="betBtn" onclick="placeBet()">ቲኬቱን አስገባ (BET)</button>
                <div class="status-banner" id="statusBanner">አዲስ ዙር ጀምሯል! ቁጥሮችን ይምረጡ</div>
            </div>
        </div>

        <!-- Other Games View Placeholder -->
        <div id="otherGameView" style="display: none; text-align: center; padding: 40px; color: #94a3b8;">
            <h3>ይህ ጨዋታ በቅርብ ቀን ይመጣል!</h3>
        </div>

        <div class="sub-tabs">
            <button class="sub-tab-btn active" onclick="switchSubTab('history', this)">🕒 History</button>
            <button class="sub-tab-btn" onclick="switchSubTab('results', this)">✔️ Results</button>
        </div>

        <div id="historyLog" class="log-box">
            <div class="log-item">ገና ምንም ውርርድ የለም</div>
        </div>
        <div id="resultsLog" class="log-box" style="display: none;">
            <div class="log-item">ገና ምንም እጣ አልወጣም</div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="filterCategory(null, 'keno')">
            <span>🎮 Games</span>
        </button>
        <button class="nav-item">
            <span>⚽ Sports</span>
        </button>
        <button class="nav-item" onclick="openDepositModal()">
            <span>💳 Wallet</span>
        </button>
        <button class="nav-item">
            <span>🎁 Promos</span>
        </button>
        <button class="nav-item">
            <span>💬 Chat</span>
        </button>
    </div>

    <!-- Deposit Popup Window -->
    <div id="depositModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeDepositModal()">&times;</span>
            <h3 style="color:#38bdf8;">የቴሌብር ባላንስ መሙያ</h3>
            <p style="font-size: 12px; color: #94a3b8; margin-top: 5px;">ማስገባት የሚፈልጉትን የብር መጠን ይፃፉ፡</p>
            
            <input type="number" id="amountInput" placeholder="መጠን (ETB)" value="50">
            <br>
            <button class="btn-modal-ok" onclick="submitDeposit()">OK (አረጋግጥ)</button>
        </div>
    </div>

    <script>
        let userBalance = 0;
        let selectedBalls = [];
        let activeBets = [];
        let currentBet = 10;
        let betsThisRound = 0;
        let maxBetsPerRound = 5;
        let timeLeft = 45;
        let isDrawing = false;
        let isResting = false;
        let totalGames = 0;
        let totalWins = 0;
        let currentDrawNum = 1024;
        
        let historyData = [];
        let resultsData = [];

        // 1. Render Keno Grid
        const grid = document.getElementById('kenoGrid');
        for (let i = 1; i <= 80; i++) {
            const ball = document.createElement('div');
            ball.className = 'ball';
            ball.id = 'ball-' + i;
            ball.innerText = i;
            ball.onclick = () => toggleBall(ball, i);
            grid.appendChild(ball);
        }

        // Category & Keno Switch Function
        function filterCategory(btn, type) {
            if (btn) {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            if (type === 'keno' || type === 'lobby') {
                document.getElementById('kenoGameSection').style.display = 'block';
                document.getElementById('otherGameView').style.display = 'none';
            } else {
                document.getElementById('kenoGameSection').style.display = 'none';
                document.getElementById('otherGameView').style.display = 'block';
            }
        }

        function toggleBall(element, num) {
            if (isDrawing || isResting) return;
            if (element.classList.contains('selected')) {
                element.classList.remove('selected');
                selectedBalls = selectedBalls.filter(n => n !== num);
            } else {
                if (selectedBalls.length < 10) {
                    element.classList.add('selected');
                    selectedBalls.push(num);
                } else {
                    alert("ከ 10 ቁጥር በላይ መምረጥ አይችሉም!");
                }
            }
        }

        function clearSelection() {
            selectedBalls = [];
            document.querySelectorAll('.ball').forEach(b => {
                b.classList.remove('selected');
                b.classList.remove('drawn');
            });
        }

        function quickPick() {
            if (isDrawing || isResting) return;
            clearSelection();
            while (selectedBalls.length < 5) {
                const rand = Math.floor(Math.random() * 80) + 1;
                if (!selectedBalls.includes(rand)) {
                    selectedBalls.push(rand);
                    document.getElementById('ball-' + rand).classList.add('selected');
                }
            }
        }

        function changeBet(val) {
            currentBet = Math.max(5, currentBet + val);
            document.getElementById('betVal').innerText = currentBet;
        }

        // 2. Timer Loop
        setInterval(() => {
            if (isDrawing || isResting) return;

            if (timeLeft > 0) {
                timeLeft--;
                let sec = timeLeft < 10 ? "0" + timeLeft : timeLeft;
                document.getElementById('timer').innerText = `00:${sec}`;
            } else {
                startAnimatedDraw();
            }
        }, 1000);

        // 3. Animated Draw
        function startAnimatedDraw() {
            isDrawing = true;
            document.getElementById('statusBanner').innerText = "🎰 እጣዎች እየወጡ ነው! ይከታተሉ...";
            document.getElementById('betBtn').disabled = true;

            let drawnNumbers = [];
            while (drawnNumbers.length < 20) {
                let r = Math.floor(Math.random() * 80) + 1;
                if (!drawnNumbers.includes(r)) drawnNumbers.push(r);
            }

            let index = 0;
            let drawInterval = setInterval(() => {
                if (index < drawnNumbers.length) {
                    let num = drawnNumbers[index];
                    let ballEl = document.getElementById('ball-' + num);
                    if (ballEl) ballEl.classList.add('drawn');
                    index++;
                } else {
                    clearInterval(drawInterval);
                    finishDraw(drawnNumbers);
                }
            }, 300);
        }

        function finishDraw(drawnNumbers) {
            let roundWinAmount = 0;
            activeBets.forEach(bet => {
                totalGames++;
                let matches = bet.numbers.filter(n => drawnNumbers.includes(n));
                let isWin = (totalGames % 10 === 2 || totalGames % 10 === 7 || matches.length >= 2);
                if (isWin) {
                    totalWins++;
                    let winPrize = bet.amount * 3;
                    roundWinAmount += winPrize;
                }
            });

            if (roundWinAmount > 0) {
                userBalance += roundWinAmount;
                document.getElementById('userBalance').innerText = userBalance;
                alert(`🎉 እጣው ወጥቷል! እንኳን ደስ አሎት +${roundWinAmount} ETB አሸንፈዋል!`);
            } else if (activeBets.length > 0) {
                alert(`እጣ ቁጥር #${currentDrawNum} ወጥቷል! በዚህ ዙር አልታደሉም።`);
            }

            resultsData.unshift(`እጣ #${currentDrawNum}: ${drawnNumbers.slice(0, 8).join(', ')}...`);
            updateResultsUI();

            startRestGap();
        }

        function startRestGap() {
            isDrawing = false;
            isResting = true;
            let gapTime = 5;

            let gapInterval = setInterval(() => {
                document.getElementById('statusBanner').innerText = `⏳ ቀጣይ ዙር በ ${gapTime} ሴኮንድ ውስጥ ይጀምራል...`;
                document.getElementById('timer').innerText = `00:0${gapTime}`;
                gapTime--;

                if (gapTime < 0) {
                    clearInterval(gapInterval);
                    isResting = false;
                    currentDrawNum++;
                    document.getElementById('drawTitle').innerText = `DRAW #${currentDrawNum}`;
                    betsThisRound = 0;
                    activeBets = [];
                    timeLeft = 45;
                    clearSelection();
                    document.getElementById('betBtn').disabled = false;
                    document.getElementById('statusBanner').innerText = "አዲስ ዙር ጀምሯል! ቁጥሮችን ይምረጡ";
                }
            }, 1000);
        }

        // 4. Place Bet Function
        function placeBet() {
            if (isDrawing || isResting) {
                alert("እጣ እየወጣ ነው ወይም ዙር በመቀየር ላይ ነው፣ እባክዎ ትንሽ ይጠብቁ!");
                return;
            }
            if (selectedBalls.length === 0) {
                alert("እባክዎ አስቀድመው ቁጥሮችን ይምረጡ!");
                return;
            }
            if (userBalance < currentBet) {
                alert("ባላንስዎ በቂ አይደለም! እባክዎ ከላይ ያለውን 'Deposit' በመንካት ባላንስ ይሙሉ (0980306278 - henok)።");
                openDepositModal();
                return;
            }
            if (betsThisRound >= maxBetsPerRound) {
                alert("በዚህ ዙር ሊያደርጉ የሚችሉት ከፍተኛው የውርርድ ብዛት (5 ጊዜ) አልቋል!");
                return;
            }

            userBalance -= currentBet;
            document.getElementById('userBalance').innerText = userBalance;
            betsThisRound++;

            activeBets.push({
                amount: currentBet,
                numbers: [...selectedBalls]
            });

            historyData.unshift(`ውርርድ #${betsThisRound}: ${currentBet} ETB [${selectedBalls.join(', ')}]`);
            updateHistoryUI();

            alert(`ውርርድዎ ተቀብሏል (${betsThisRound}/5)! እጣው እስኪወጣ ይጠብቁ።`);
            clearSelection();
        }

        function switchSubTab(tab, btn) {
            document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (tab === 'history') {
                document.getElementById('historyLog').style.display = 'block';
                document.getElementById('resultsLog').style.display = 'none';
            } else {
                document.getElementById('historyLog').style.display = 'none';
                document.getElementById('resultsLog').style.display = 'block';
            }
        }

        function updateHistoryUI() {
            const list = document.getElementById('historyLog');
            list.innerHTML = historyData.map(h => `<div class="log-item">• ${h}</div>`).join('');
        }

        function updateResultsUI() {
            const list = document.getElementById('resultsLog');
            list.innerHTML = resultsData.map(r => `<div class="log-item">✔️ ${r}</div>`).join('');
        }

        function openDepositModal() {
            document.getElementById('depositModal').style.display = 'flex';
        }

        function closeDepositModal() {
            document.getElementById('depositModal').style.display = 'none';
        }

        function submitDeposit() {
            const amount = document.getElementById('amountInput').value;
            if (!amount || amount <= 0) {
                alert("እባክዎ ትክክለኛ የብር መጠን ያስገቡ!");
                return;
            }

            alert("የጠየቁት የብር መጠን: " + amount + " ETB\n" +
                  "-----------------------------------\n" +
                  " ገንዘብ የሚላክበት የቴሌብር አድራሻ:\n" +
                  " ስም: henok\n" +
                  " ስልክ ቁጥር: 0980306278\n" +
                  "-----------------------------------\n" +
                  "እባክዎ ገንዘቡን ከላኩ በኋላ OK ይበሉ!");

            closeDepositModal();

            userBalance += Number(amount);
            document.getElementById('userBalance').innerText = userBalance;
            alert("የቴሌብር ባላንስ በተሳካ ሁኔታ ተሞልቷል!");
        }
    </script>
</body>
</html>
