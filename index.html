<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beteseb Plus - ኬኖ ጨዋታ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121824;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 {
            color: #38bdf8;
            margin-bottom: 15px;
        }
        .telebirr-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid #334155;
        }
        input {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #1e293b;
            color: white;
            text-align: center;
        }
        button {
            background-color: #0284c7;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background-color: #0ea5e9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Beteseb Plus Keno</h2>
        <p>እንኳን ወደ ኬኖ ጨዋታ በደህና መጡ!</p>

        <!-- የቴሌብር ባላንስ መሙያ ክፍል -->
        <div class="telebirr-box">
            <h3>ቴሌብር በመጠቀም ባላንስ ይሙሉ</h3>
            <input type="number" id="amountInput" placeholder="የብር መጠን (ETB)" value="50">
            <br>
            <button onclick="addHenokBalance()">በቴሌብር (Telebirr) ኪስዎትን ይሙሉ</button>
        </div>
    </div>

    <script>
        // የቴሌብር ዌብሁክ እና ባላንስ መሙያ ፌንክሽን
        function addHenokBalance() {
            const amount = document.getElementById('amountInput').value;
            
            if (!amount || amount <= 0) {
                alert("እባክዎ ትክክለኛ የብር መጠን ያስገቡ!");
                return;
            }

            fetch('http://127.0.0.1:8000/api/telebirr-webhook', { 
                method: 'POST', 
                headers: { 
                    'Content-Type': 'application/json' 
                }, 
                body: JSON.stringify({
                    outTradeNo: "TXN_" + Date.now(), 
                    totalAmount: amount.toString(), 
                    userId: "0980306278", // የሄኖክ ስልክ ቁጥር
                    status: "COMPLETED" 
                }) 
            })
            .then(response => response.json()) 
            .then(data => { 
                if (data.status === "success") { 
                    alert("የቴሌብር ባላንስ በተሳካ ሁኔታ ተሞልቷል!"); 
                } else {
                    alert("ክፍያው አልተሳካም፣ እባክዎ እንደገና ይሞክሩ።");
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("ከሰርቨር ጋር መገናኘት አልተቻለም!");
            });
        }
    </script>
</body>
    </html>
