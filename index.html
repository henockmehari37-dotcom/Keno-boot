<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAST KENO CASINO</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #0b1118;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 5px;
            user-select: none;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121b26;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 440px;
            margin: 0 auto 6px auto;
            border: 1px solid #1e293b;
        }
        .logo { font-weight: 900; color: #00ff88; font-size: 15px; }
        .timer-box {
            background: #1a2634;
            color: #00ff88;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid #2a3b4c;
        }
        .balance-box { font-size: 13px; color: #94a3b8; }
        .balance-box span { color: #00ff88; font-weight: bold; }

        .banner {
            background: linear-gradient(135deg, #132235, #0f1722);
            border: 1px solid #1e293b;
            padding: 8px;
            border-radius: 8px;
            max-width: 440px;
            margin: 0 auto 6px auto;
            font-size: 13px;
            color: #94a3b8;
        }
        .banner span { color: #ffffff; font-weight: bold; }

        /* 80 Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            max-width: 440px;
            margin: 0 auto;
            background: #121b26;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid #1e293b;
        }
        .cell {
            background-color: #1a2634;
            color: #cbd5e1;
            border: 1px solid #2a3b4c;
            padding: 8px 0;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.15s;
        }
        .cell.selected {
            background-color: #00ff88;
            color: #0b1118;
            border-color: #fff;
            font-weight: 900;
        }
        .cell.drawn {
            background-color: #ff9800;
            color: #0b1118;
            font-weight: 900;
            transform: scale(1.08);
            box-shadow: 0 0 10px #ff9800;
        }
        .cell.matched {
            background-color: #ef4444;
            color: #ffffff;
            font-weight: 900;
            transform: scale(1.12);
            box-shadow: 0 0 12px #ef4444;
            animation: pulse 0.3s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        .controls-row {
            max-width: 440px;
            margin: 6px auto;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .bet-adjuster {
            flex: 1;
            background: #121b26;
            border: 1px solid #1e293b;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 10px;
        }
        .bet-ctrl-btn {
            background: #1a2634;
            border: 1px solid #2a3b4c;
            color: #fff;
            font-size: 16px;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .quick-btn {
            background: #121b26;
            border: 1px solid #1e293b;
            color: #00ff88;
            padding: 10px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .bet-btn {
            background: linear-gradient(135deg, #00ff88, #00b4d8);
            color: #0b1118;
            border: none;
            width: 100%;
            max-width: 440px;
            padding: 13px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            margin: 4px auto;
        }

        .view-container {
            max-width: 440px;
            margin: 6px auto;
            display: none;
        }
        .view-container.active {
            display: block;
        }

        .ticket-card {
            background: #121b26;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            text-align: left;
        }
        .ticket-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #00ff88;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .ticket-numbers {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .t-num {
            background: #1a2634;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        .ticket-footer {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid #1e293b;
            padding-top: 6px;
        }

        .bottom-nav {
            max-width: 440px;
            margin: 8px auto 0 auto;
            background: #121b26;
            border: 1px solid #1e293b;
            border-radius: 8px;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            font-size: 11px;
            color: #64748b;
            font-weight: bold;
        }
        .bottom-nav div { cursor: pointer; padding: 4px 8px; border-radius: 4px; }
        .bottom-nav div.active { color: #00ff88; background: #1a2634; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo">⚡ FAST KENO</div>
        <div class="timer-box" id="timer-display">00:30</div>
        <div class="balance-box">ባላንስ: <span id="user-balance">50.00</span></div>
    </div>

    <!-- VIEW 1: GAME -->
    <div id="view-game" class="view-container active">
        <div class="banner">
            Choose 10 numbers | የተመረጡ: <span id="selected-count" style="color:#00ff88;">0</span>/10
            <div style="margin-top: 4px; font-size: 11px; color: #f59e0b;">መደቦች (Tickets): <span id="ticket-qty" style="color:#fff;">1</span>/20</div>
        </div>

        <div class="grid" id="keno-grid"></div>

        <div class="controls-row">
            <div class="bet-adjuster">
                <button class="bet-ctrl-btn" onclick="changeBet(-5)">-</button>
                <span id="bet-amount" style="font-size: 14px; font-weight: bold; color: #00ff88;">10 ETB</span>
                <button class="bet-ctrl-btn" onclick="changeBet(5)">+</button>
            </div>
            <button class="quick-btn" onclick="changeTickets(1)">🎫 ቲኬት (+1)</button>
            <button class="quick-btn" onclick="quickPick()">🎲 Quick</button>
            <button class="quick-btn" onclick="clearSelection()" style="color: #ef4444;">🗑️</button>
        </div>

        <button class="bet-btn" id="bet-button" onclick="placeBet()">ቲኬቱን አስገባ (BET)</button>

        <div id="status-text" style="background:#121b26; border:1px solid #1e293b; padding:8px; border-radius:8px; margin-top:6px; font-size:12px; color: #f59e0b; font-weight: bold;">
            10 ቁጥሮችን ይምረጡ እና BET ይጫኑ
        </div>
    </div>

    <!-- VIEW 2: HISTORY -->
    <div id="view-history" class="view-container">
        <div style="font-size: 14px; font-weight: bold; color: #00ff88; margin-bottom: 8px; text-align: left;">📜 My Tickets / History</div>
        <div id="history-list">
            <div style="color: #94a3b8; font-size: 12px; padding: 20px;">እስካሁን የተደረገ ውርርድ የለም</div>
        </div>
    </div>

    <!-- VIEW 3: RESULTS -->
    <div id="view-results" class="view-container">
        <div style="font-size: 14px; font-weight: bold; color: #00ff88; margin-bottom: 8px; text-align: left;">✔ Recent Draw Results</div>
        <div id="results-list">
            <div style="color: #94a3b8; font-size: 12px; padding: 20px;">የወጡ እጣዎች ገና የሉም</div>
        </div>
    </div>

    <!-- VIEW 4: STATS -->
    <div id="view-stats" class="view-container">
        <div style="font-size: 14px; font-weight: bold; color: #00ff88; margin-bottom: 8px; text-align: left;">📊 Game Statistics</div>
        <div style="background:#121b26; border:1px solid #1e293b; padding:12px; border-radius:8px; text-align:left; font-size:12px; color:#94a3b8;">
            <div>ጠቅላላ የተደረጉ ጨዋታዎች: <span id="stat-total" style="color:#fff; font-weight:bold;">0</span></div>
            <div>የተሸነፉ/ያሸነፉ: <span id="stat-wins" style="color:#00ff88; font-weight:bold;">0</span></div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <div id="nav-game" class="active" onclick="switchTab('game')">▶ GAME</div>
        <div id="nav-history" onclick="switchTab('history')">🕒 HISTORY</div>
        <div id="nav-results" onclick="switchTab('results')">✔ RESULTS</div>
        <div id="nav-stats" onclick="switchTab('stats')">📊 STATS</div>
    </div>

    <script>
        let balance = localStorage.getItem('fast_keno_bal') ? parseFloat(localStorage.getItem('fast_keno_bal')) : 50.00;
        let bet = 10;
        let ticketQty = 1;
        let selectedNumbers = [];
        let activeTickets = [];
        let isDrawing = false;
        let countdown = 30;
        let ticketsHistory = JSON.parse(localStorage.getItem('fast_keno_tickets')) || [];
        let totalGames = parseInt(localStorage.getItem('fast_keno_total') || '0');
        let totalWins = parseInt(localStorage.getItem('fast_keno_wins') || '0');

        const gridEl = document.getElementById('keno-grid');
        const balanceEl = document.getElementById('user-balance');
        const betAmountEl = document.getElementById('bet-amount');
        const selectedCountEl = document.getElementById('selected-count');
        const ticketQtyEl = document.getElementById('ticket-qty');
        const statusTextEl = document.getElementById('status-text');
        const timerDisplayEl = document.getElementById('timer-display');

        balanceEl.innerText = balance.toFixed(2);
        renderHistoryAndResults();

        for (let i = 1; i <= 80; i++) {
            const btn = document.createElement('button');
            btn.className = 'cell';
            btn.innerText = i;
            btn.onclick = () => toggleNumber(i, btn);
            gridEl.appendChild(btn);
        }

        // ያለማቋረጥ የሚቆጠር የ 30 ሰኮንድ ቆጠራ
        setInterval(() => {
            if (!isDrawing) {
                countdown--;
                if (countdown < 0) {
                    countdown = 30;
                    startDrawProcess();
                }
                let secStr = countdown < 10 ? '0' + countdown : countdown;
                timerDisplayEl.innerText = `00:\${secStr}`;
            }
        }, 1000);

        function switchTab(tabName) {
            document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.bottom-nav div').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + tabName).classList.add('active');
            document.getElementById('nav-' + tabName).classList.add('active');
        }

        function toggleNumber(num, btn) {
            if (isDrawing) return;
            const index = selectedNumbers.indexOf(num);
            if (index > -1) {
                selectedNumbers.splice(index, 1);
                btn.classList.remove('selected');
            } else {
                if (selectedNumbers.length >= 10) {
                    statusTextEl.innerText = "⚠️ በትክክል 10 ቁጥሮች ብቻ መምረጥ ይቻላል!";
                    return;
                }
                selectedNumbers.push(num);
                btn.classList.add('selected');
            }
            selectedNumbers.sort((a, b) => a - b);
            selectedCountEl.innerText = selectedNumbers.length;
            statusTextEl.innerText = selectedNumbers.length === 10 ? "10 ቁጥሮች ተመርጠዋል!" : `እባክ
