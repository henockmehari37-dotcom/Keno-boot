<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beteseb Plus - ኬኖ ጨዋታ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121824;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }
        .balance-info {
            font-size: 16px;
            font-weight: bold;
            color: #38bdf8;
        }
        .btn-deposit {
            background-color: #10b981;
            color: white;
            padding: 8px 15px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-deposit:hover {
            background-color: #059669;
        }
        .game-container {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        /* የኬኖ ቁጥሮች ግሪድ ዲዛይን */
        .keno-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            margin: 15px 0;
        }
        .keno-ball {
            background-color: #0f172a;
            color: #cbd5e1;
            padding: 10px 0;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #334155;
            cursor: pointer;
        }
        .keno-ball.selected {
            background-color: #f59e0b;
            color: white;
            font-weight: bold;
            border-color: #d97706;
        }
        .btn-bet {
            background-color: #0284c7;
            color: white;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-bet:hover {
            background-color: #0ea5e9;
        }
        /* የሞዳል (Popup) መስኮት ዲዛይን */
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            border: 1px solid #334155;
            text-align: center;
        }
        input {
            width: 90%;
            padding: 12px;
            font-size: 16px;
            margin: 15px 0;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            text-align: center;
        }
        .btn-submit {
            background-color: #0284c7;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: bold;
        }
        .close-btn {
            color: #aaa;
            float: right;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-btn:hover {
            color: white;
        }
    </style>
</head>
<body>

    <!-- ከጌሙ በላይ የሚገኘው የባላንስ እና የዲፖዚት ማጠናቀቂያ ባር -->
    <div class="header-bar">
        <div class="balance-info">ባላንስ: <span id="userBalance">0</span> ETB</div>
        <button class="btn-deposit" onclick="openDepositModal()">Deposit (ባላንስ መሙያ)</button>
    </div>

    <!-- ዋናው የኬኖ ጨዋታ ገጽ -->
    <div class="game-container">
        <h2>Beteseb Plus Keno</h2>
        <p style="font-size: 13px; color: #94a3b8;">ቁጥሮችን በመምረጥ ጨዋታውን ይጫወቱ!</p>

        <!-- የኬኖ ቁጥሮች (1 እስከ 80) -->
        <div class="keno-grid" id="kenoGrid">
            <!-- በ JavaScript በኩል ይሞላል -->
        </div>

        <button class="btn-bet" onclick="placeBet()">ውርርድ አድርግ (BET)</button>
    </div>

    <!-- የገንዘብ መጠን የሚጽፉበት ፖፕአፕ መስኮት (Modal) -->
    <div id="depositModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeDepositModal()">&times;</span>
            <h3>የቴሌብር ባላንስ መሙያ</h3>
            <p style="font-size: 13px; color: #94a3b8;">እባክዎ ማስገባት የሚፈልጉትን የብር መጠን ይፃፉ፡</p>
            
            <input type="number" id="amountInput" placeholder="ለምሳሌ: 50" value="50">
            <br>
            <button class="btn-submit" onclick="submitDeposit()">OK (አረጋግጥ)</button>
        </div>
    </div>

    <script>
        // 1 እስከ 80 ያሉትን የኬኖ ኳሶች በግሪዱ ውስጥ መሙላት
        const grid = document.getElementById('kenoGrid');
        for (let i = 1; i <= 80; i++) {
            const ball = document.createElement('div');
            ball.className = 'keno-ball';
            ball.innerText = i;
            ball.onclick = function() {
                ball.classList.toggle('selected');
            };
            grid.appendChild(ball);
        }

        // ፖፕአፕ መስኮቱን መክፈቻ
        function openDepositModal() {
            document.getElementById('depositModal').style.display = 'flex';
        }

        // ፖፕአፕ መስኮቱን መዘጊያ
        function closeDepositModal() {
            document.getElementById('depositModal').style.display = 'none';
        }

        // OK ሲሉ የሚሰራው እና የቴሌብር መረጃዎችን የሚያሳየው ፌንክሽን
        function submitDeposit() {
            const amount = document.getElementById('amountInput').value;
            
            if (!amount || amount <= 0) {
                alert("እባክዎ ትክክለኛ የብር መጠን ያስገቡ!");
                return;
            }

            // የቴሌብር መረጃዎችን ማሳየት
            alert("የጠየቁት የብር መጠን: " + amount + " ETB\n" +
                  "-----------------------------------\n" +
                  " ገንዘብ የሚላክበት የቴሌብር አድራሻ:\n" +
                  " ስም: henok\n" +
                  " ስልክ ቁጥር: 0980306278\n" +
                  "-----------------------------------\n" +
                  "እባክዎ ገንዘቡን ከላኩ በኋላ ያረጋግጡ!");

            closeDepositModal();

            // ሰርቨር ላይ ባላንስ የማዘመን ጥያቄ መላክ
            fetch('http://127.0.0.1:8000/api/telebirr-webhook', { 
                method: 'POST', 
                headers: { 
                    'Content-Type': 'application/json' 
                }, 
                body: JSON.stringify({
                    outTradeNo: "TXN_" + Date.now(), 
                    totalAmount: amount.toString(), 
                    userId: "0980306278", 
                    status: "COMPLETED" 
                }) 
            })
            .then(response => response.json()) 
            .then(data => { 
                if (data.status === "success") { 
                    document.getElementById('userBalance').innerText = amount;
                    alert("የቴሌብር ባላንስ በተሳካ ሁኔታ ተሞልቷል!"); 
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
        }

        function placeBet() {
            alert("ውርርዱ ተቀባይነት አግኝቷል! መልካም እድል!");
        }
    </script>
</body>
    </html>
