<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ras Bet - Games Lobby</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg-color: #0b151b;
      --card-bg: #12212b;
      --accent-purple: #8a2be2;
      --purple-gradient: linear-gradient(135deg, #a832e3, #6a11cb);
      --text-white: #ffffff;
      --text-gray: #9aa8b6;
      --nav-bg: #091a24;
      --border-color: #1e3342;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: 80px;
      position: relative;
      min-height: 100vh;
    }

    /* Top Banner */
    .top-banner {
      background: linear-gradient(135deg, #4a00e0, #8e2de2);
      padding: 15px;
      border-radius: 12px;
      margin: 10px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
    }

    .banner-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .banner-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .banner-text h3 {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .btn-click-here {
      background-color: #ffffff;
      color: #6a11cb;
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      text-transform: uppercase;
    }

    .dots-indicator {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 5px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background-color: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
    }

    .dot.active {
      background-color: #00d2ff;
      width: 14px;
      border-radius: 10px;
    }

    /* Categories Horizontal Scroll */
    .categories-tabs {
      display: flex;
      gap: 10px;
      padding: 10px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .categories-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background-color: var(--card-bg);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text-gray);
      cursor: pointer;
      border: 1px solid var(--border-color);
    }

    .tab.active {
      background: var(--purple-gradient);
      color: var(--text-white);
      border: none;
      font-weight: 600;
    }

    /* Search Bar & Filter */
    .search-container {
      padding: 5px 10px;
    }

    .search-box, .filter-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-white);
      width: 100%;
      font-size: 14px;
    }

    .filter-box {
      color: var(--text-gray);
      font-size: 14px;
      cursor: pointer;
    }

    /* Section Header */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 10px 10px 10px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
    }

    .btn-collapse {
      background-color: #1a2b36;
      border: none;
      color: var(--text-gray);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    /* Game Grid */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 10px 20px 10px;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-white);
    }

    .game-thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background-color: #1a2b3c;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .game-title {
      font-size: 12px;
      margin-top: 6px;
      text-align: center;
      color: #c4d1db;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* JetX Custom Card Styling */
    .bg-jetx {
      background: linear-gradient(180deg, #111 0%, #3a3000 100%);
      color: #ffe600;
      font-weight: bold;
      font-size: 20px;
      font-style: italic;
    }

    /* Aviator Custom Card Styling */
    .bg-aviator {
      background: linear-gradient(180deg, #600 0%, #200 100%);
      color: #fff;
      font-weight: bold;
      font-size: 18px;
    }

    /* Floating Cashback Button */
    .floating-cashback {
      position: fixed;
      bottom: 75px;
      right: 15px;
      background: var(--purple-gradient);
      color: white;
      padding: 10px 18px;
      border-radius: 25px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(138, 43, 226, 0.5);
      cursor: pointer;
      z-index: 100;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background-color: var(--nav-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-gray);
      text-decoration: none;
      font-size: 11px;
    }

    .nav-item.active {
      color: var(--accent-purple);
    }

    .nav-item i {
      font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- Top Banner -->
  <div class="top-banner">
    <div class="banner-top-bar">
      <span><i class="fa-solid fa-xmark"></i> Close</span>
      <div>
        <i class="fa-solid fa-chevron-down"></i>
        <i class="fa-solid fa-ellipsis-vertical" style="margin-left: 10px;"></i>
      </div>
    </div>
    <div class="banner-content">
      <div class="banner-text">
        <h3>ይመዝገቡና ያሸንፉ!</h3>
        <p style="font-size: 11px; opacity: 0.9;">ደስታን እና አሁኑኑ ይህንን ተጨዋች ይግጠሙ!</p>
      </div>
      <button class="btn-click-here">CLICK HERE</button>
    </div>
    <div class="dots-indicator">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <!-- Category Tabs -->
  <div class="categories-tabs">
    <div class="tab active"><i class="fa-solid fa-gamepad"></i> Lobby</div>
    <div class="tab"><i class="fa-solid fa-dice"></i> Slot</div>
    <div class="tab"><i class="fa-solid fa-rocket"></i> Crash games</div>
    <div class="tab"><i class="fa-solid fa-trophy"></i> Live</div>
  </div>

  <!-- Search & Provider Filters -->
  <div class="search-container">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass" style="color: var(--text-gray);"></i>
      <input type="text" placeholder="Search games..." />
    </div>
    <div class="filter-box">
      <i class="fa-solid fa-sliders"></i>
      <span>All Providers</span>
    </div>
  </div>

  <!-- Ras Bet Trending Section -->
  <div class="section-header">
    <div class="section-title">Ras Bet Trending</div>
    <button class="btn-collapse">Collapse</button>
  </div>

  <!-- Game Cards Grid -->
  <div class="games-grid">
    <!-- Game 1 -->
    <a href="#" class="game-card">
      <div class="game-thumb bg-jetx">
        <span>JetX</span>
      </div>
      <span class="game-title">JetX</span>
    </a>

    <!-- Game 2 -->
    <a href="#" class="game-card">
      <div class="game-thumb">
        <img src="https://via.placeholder.com/150/006633/ffffff?text=MULTI+HOT+5" alt="Multi Hot 5" />
      </div>
      <span class="game-title">Multi Hot 5</span>
    </a>

    <!-- Game 3 -->
    <a href="#" class="game-card">
      <div class="game-thumb">
        <img src="https://via.placeholder.com/150/cc9900/ffffff?text=FORTUNE+COINS" alt="Fortune Coins 2" />
      </div>
      <span class="game-title">Fortune Coins 2</span>
    </a>

    <!-- Game 4 -->
    <a href="#" class="game-card">
      <div class="game-thumb">
        <img src="https://via.placeholder.com/150/004433/ffffff?text=BURNING+WILD" alt="Multi Hot 5 Burn Wilds" />
      </div>
      <span class="game-title">Multi Hot 5 Bu...</span>
    </a>

    <!-- Game 5 -->
    <a href="#" class="game-card">
      <div class="game-thumb bg-aviator">
        <span>Aviator</span>
      </div>
      <span class="game-title">Aviator</span>
    </a>

    <!-- Game 6 -->
    <a href="#" class="game-card">
      <div class="game-thumb">
        <img src="https://via.placeholder.com/150/990000/ffffff?text=CHICKEN+ROAD" alt="Chicken Road 2" />
      </div>
      <span class="game-title">Chicken Road 2</span>
    </a>
  </div>

  <!-- Floating Cashback Button -->
  <div class="floating-cashback">
    <i class="fa-solid fa-gift"></i>
    <span>Check Cashback</span>
    <i class="fa-solid fa-chevron-right"></i>
  </div>

  <!-- Bottom Navigation Bar -->
  <div class="bottom-nav">
    <a href="#" class="nav-item active">
      <i class="fa-solid fa-gamepad"></i>
      <span>Games</span>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-futbol"></i>
      <span>Sports</span>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-wallet"></i>
      <span>Wallet</span>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-gift"></i>
      <span>Promos</span>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-regular fa-comment-dots"></i>
      <span>Chat</span>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-ellipsis"></i>
      <span>More</span>
    </a>
  </div>

</body>
</html>
