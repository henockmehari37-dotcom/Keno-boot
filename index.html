<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAST KENO CASINO</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #0b1118;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 5px;
            user-select: none;
        }
        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121b26;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 440px;
            margin: 0 auto 6px auto;
            border: 1px solid #1e293b;
        }
        .logo {
            font-weight: 900;
            color: #00ff88;
            font-size: 15px;
            letter-spacing: 0.5px;
        }
        .timer-box {
            background: #1a2634;
            color: #00ff88;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid #2a3b4c;
        }
        .balance-box {
            font-size: 13px;
            color: #94a3b8;
        }
        .balance-box span {
            color: #00ff88;
            font-weight: bold;
        }

        /* Banner info */
        .banner {
            background: linear-gradient(135deg, #132235, #0f1722);
            border: 1px solid #1e293b;
            padding: 8px;
            border-radius: 8px;
            max-width: 440px;
            margin: 0 auto 6px auto;
            font-size: 13px;
            color: #94a3b8;
        }
        .banner span { color: #ffffff; font-weight: bold; }

        /* 80 Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            max-width: 440px;
            margin: 0 auto;
            background: #121b26;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid #1e293b;
        }
        .cell {
            background-color: #1a2634;
            color: #cbd5e1;
            border: 1px solid #2a3b4c;
            padding: 8px 0;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.1s;
        }
        .cell:active { transform: scale(0.92); }
        .cell.selected {
            background-color: #00ff88;
            color: #0b1118;
            border-color: #fff;
            font-weight: 900;
            box-shadow: 0 0 8px rgba(0,255,136,0.4);
        }
        .cell.drawn {
            background-color: #ff9800;
            color: #0b1118;
            font-weight: 900;
        }
        .cell.matched {
            background-color: #ef4444;
            color: #ffffff;
            font-weight: 900;
            box-shadow: 0 0 10px #ef4444;
        }

        /* Controls / Bet Adjuster */
        .controls-row {
            max-width: 440px;
            margin: 6px auto;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .bet-adjuster {
            flex: 1;
            background: #121b26;
            border: 1px solid #1e293b;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 10px;
        }
        .bet-ctrl-btn {
            background: #1a2634;
            border: 1px solid #2a3b4c;
            color: #fff;
            font-size: 16px;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .quick-btn {
            background: #121b26;
            border: 1px solid #1e293b;
            color: #00ff88;
            padding: 10px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Main BET Button */
        .bet-btn {
            background: linear-gradient(135deg, #00ff88, #00b4d8);
            color: #0b1118;
            border: none;
            width: 100%;
            max-width: 440px;
            padding: 13px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(0, 255, 136, 0.3);
            margin: 4px auto;
        }
        .bet-btn:disabled {
            background: #1e293b;
            color: #64748b;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Bottom Nav Bar (Like Screenshot) */
        .bottom-nav {
            max-width: 440px;
            margin: 8px auto 0 auto;
            background: #121b26;
            border: 1px solid #1e293b;
            border-radius: 8px;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            font-size: 11px;
            color: #64748b;
            font-weight: bold;
        }
        .bottom-nav div {
            cursor: pointer;
        }
        .bottom-nav div.active {
            color: #00ff88;
        }

        /* History & Status Box */
        .info-box {
            max-width: 440px;
            margin: 6px auto;
            background: #121b26;
            border: 1px solid #1e293b;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo">⚡ FAST KENO</div>
        <div class="timer-box" id="timer-display">00:30</div>
        <div class="balance-box">ባላንስ: <span id="user-balance">50.00</span></div>
    </div>

    <div class="banner">
        Choose up to 10 numbers | የተመረጡ: <span id="selected-count" style="color:#00ff88;">0</span>/10
    </div>

    <div class="grid" id="keno-grid"></div>

    <div class="controls-row">
        <div class="bet-adjuster">
            <button class="bet-ctrl-btn" onclick="changeBet(-5)">-</button>
            <span id="bet-amount" style="font-size: 15px; font-weight: bold; color: #00ff88;">10 ETB</span>
            <button class="bet-ctrl-btn" onclick="changeBet(5)">+</button>
        </div>
        <button class="quick-btn" onclick="quickPick()">🎲 Quick Pick</button>
        <button class="quick-btn" onclick="clearSelection()" style="color: #ef4444;">🗑️ Clear</button>
    </div>

    <button class="bet-btn" id="bet-button" onclick="startDraw()">BET</button>

    <div class="info-box" id="status-text" style="text-align: center; color: #f59e0b; font-weight: bold;">
        አዲስ ዙር ለመጀመር ቁጥሮችን ይምረጡ
    </div>

    <div class="info-box" style="max-height: 70px; overflow-y: auto;">
        <div style="color: #ff9800; font-weight: bold; margin-bottom: 2px;">📜 የጨዋታ ታሪክ (History):</div>
        <div id="history-content" style="color: #94a3b8; font-size: 11px;">እስካሁን የተደረገ ጨዋታ የለም</div>
    </div>

    <div class="bottom-nav">
        <div class="active">▶ GAME</div>
        <div>🕒 HISTORY</div>
        <div>✔ RESULTS</div>
        <div>📊 STATS</div>
    </div>

    <script>
        let balance = localStorage.getItem('fast_keno_bal') ? parseFloat(localStorage.getItem('fast_keno_bal')) : 50.00;
        let bet = 10;
        let selectedNumbers = [];
        let winningNumbers = [];
        let isPlaying = false;
        let gameHistory = JSON.parse(localStorage.getItem('fast_keno_hist')) || [];

        const gridEl = document.getElementById('keno-grid');
        const balanceEl = document.getElementById('user-balance');
        const betAmountEl = document.getElementById('bet-amount');
        const selectedCountEl = document.getElementById('selected-count');
        const statusTextEl = document.getElementById('status-text');
        const betBtnEl = document.getElementById('bet-button');
        const timerDisplayEl = document.getElementById('timer-display');
        const historyContentEl = document.getElementById('history-content');

        balanceEl.innerText = balance.toFixed(2);
        updateHistoryUI();

        for (let i = 1; i <= 80; i++) {
            const btn = document.createElement('button');
            btn.className = 'cell';
            btn.innerText = i;
            btn.onclick = () => toggleNumber(i, btn);
            gridEl.appendChild(btn);
        }

        function toggleNumber(num, btn) {
            if (isPlaying) return;
            const index = selectedNumbers.indexOf(num);
            if (index > -1) {
                selectedNumbers.splice(index, 1);
                btn.classList.remove('selected');
            } else {
                if (selectedNumbers.length >= 10) {
                    statusTextEl.innerText = "⚠️ ከ 10 በላይ ቁጥሮች መምረጥ አይችሉም!";
                    return;
                }
                selectedNumbers.push(num);
                btn.classList.add('selected');
            }
            selectedNumbers.sort((a, b) => a - b);
            selectedCountEl.innerText = selectedNumbers.length;
            if (selectedNumbers.length > 0) {
                statusTextEl.innerText = "ቁጥሮች ተመርጠዋል! BET የሚለውን ይጫኑ";
            } else {
                statusTextEl.innerText = "አዲስ ዙር ለመጀመር ቁጥሮችን ይምረጡ";
            }
        }

        function quickPick() {
            if (isPlaying) return;
            clearSelection();
            while (selectedNumbers.length < 5) {
                let rand = Math.floor(Math.random() * 80) + 1;
                if (!selectedNumbers.includes(rand)) {
                    selectedNumbers.push(rand);
                }
            }
            selectedNumbers.sort((a, b) => a - b);
            selectedCountEl.innerText = selectedNumbers.length;
            const cells = gridEl.getElementsByClassName('cell');
            for (let cell of cells) {
                let num = parseInt(cell.innerText);
                if (selectedNumbers.includes(num)) cell.classList.add('selected');
            }
            statusTextEl.innerText = "🎲 Quick Pick ተሳክቷል!";
        }

        function clearSelection() {
            if (isPlaying) return;
            selectedNumbers = [];
            selectedCountEl.innerText = "0";
            const cells = gridEl.getElementsByClassName('cell');
            for (let cell of cells) cell.classList.remove('selected', 'drawn', 'matched');
            statusTextEl.innerText = "ቦርዱ ጸድቷል";
        }

        function changeBet(amount) {
            if (isPlaying) return;
            bet += amount;
            if (bet < 5) bet = 5;
            if (bet > balance) bet = balance;
            betAmountEl.innerText = bet + " ETB";
        }

        function startDraw() {
            if (isPlaying) return;
            if (selectedNumbers.length === 0) {
                statusTextEl.innerText = "⚠️ ቢያንስ 1 ቁጥር ይምረጡ!";
                return;
            }
            if (balance < bet) {
                statusTextEl.innerText = "⚠️ ሂሳብዎ በቂ አይደለም!";
                return;
            }

            clearBoardVisuals();
            balance -= bet;
            balanceEl.innerText = balance.toFixed(2);
            saveData();

            isPlaying = true;
            betBtnEl.disabled = true;

            let countdown = 30;
            timerDisplayEl.innerText = `00:${countdown < 10 ? '0' : ''}${countdown}`;
            statusTextEl.innerText = "⏳ ቆጠራ በመሄድ ላይ...";

            let timer = setInterval(() => {
                countdown--;
                timerDisplayEl.innerText = `00:${countdown < 10 ? '0' : ''}${countdown}`;
                if (countdown <= 0) {
                    clearInterval(timer);
                    runDrawProcess();
                }
            }, 1000);
        }

        function runDrawProcess() {
            statusTextEl.innerText = "🎲 20 እጣዎች እየወጡ ነው...";
            winningNumbers = [];
            while (winningNumbers.length < 20) {
                let rand = Math.floor(Math.random() * 80) + 1;
                if (!winningNumbers.includes(rand)) winningNumbers.push(rand);
            }

            const cells = gridEl.getElementsByClassName('cell');
            for (let cell of cells) {
                let num = parseInt(cell.innerText);
                if (winningNumbers.includes(num)) {
                    if (selectedNumbers.includes(num)) cell.classList.add('matched');
                    else cell.classList.add('drawn');
                }
            }

            let matches = selectedNumbers.filter(n => winningNumbers.includes(n)).length;
            let winAmount = matches >= 3 ? bet * matches * 2 : (matches === 2 ? bet * 1.5 : 0);

            if (winAmount > 0) {
                balance += winAmount;
                statusTextEl.innerHTML = `🎉 <span style="color:#00ff88;">አሸንፈዋል!</span> ${matches} ገጥሟል (+${winAmount.toFixed(2)} ብር)`;
            } else {
                statusTextEl.innerHTML = `😢 <span style="color:#ef4444;">አልገጠመም!</span> ${matches} ቁጥር ብቻ።`;
            }

            balanceEl.innerText = balance.toFixed(2);
            saveData();

            let historyItem = `ግጥሚያ: ${matches}/${selectedNumbers.length} | ሽልማት: +${winAmount.toFixed(2)} ብር`;
            gameHistory.unshift(historyItem);
            if (gameHistory.length > 5) gameHistory.pop();
            localStorage.setItem('fast_keno_hist', JSON.stringify(gameHistory));
            updateHistoryUI();

            setTimeout(() => { resetGame(); }, 5000);
        }

        function clearBoardVisuals() {
            const cells = gridEl.getElementsByClassName('cell');
            for (let cell of cells) cell.classList.remove('drawn', 'matched');
        }

        function resetGame() {
            isPlaying = false;
            betBtnEl.disabled = false;
            timerDisplayEl.innerText = "00:30";
            selectedNumbers = [];
            selectedCountEl.innerText = "0";
            const cells = gridEl.getElementsByClassName('cell');
            for (let cell of cells) cell.classList.remove('selected', 'drawn', 'matched');
            statusTextEl.innerText = "አዲስ ዙር ለመጀመር ቁጥሮችን ይምረጡ";
        }

        function saveData() {
            localStorage.setItem('fast_keno_bal', balance);
        }

        function updateHistoryUI() {
            if (gameHistory.length > 0) {
                historyContentEl.innerHTML = gameHistory.map(h => `<div>• ${h}</div>`).join('');
            }
        }
    </script>
</body>
</html>
